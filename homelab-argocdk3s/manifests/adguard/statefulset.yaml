apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: adguard
  labels:
    app: adguard
spec:
  serviceName: adguard-headless
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: adguard
  template:
    metadata:
      labels:
        app: adguard
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: adguard
      containers:
        - name: adguard
          image: adguard/adguardhome:v0.107.57   # auf aktuelle Version pinnen
          ports:
            - { name: dns-udp, containerPort: 53,   protocol: UDP }
            - { name: dns-tcp, containerPort: 53,   protocol: TCP }
            - { name: http,    containerPort: 80,   protocol: TCP }
            - { name: setup,   containerPort: 3000, protocol: TCP }
          # Bewusst keine livenessProbe: vor dem Setup-Wizard lauscht kein DNS.
          readinessProbe:
            tcpSocket:
              port: 53
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 50m,  memory: 128Mi }
            limits:   { cpu: 500m, memory: 512Mi }
          volumeMounts:
            - { name: work, mountPath: /opt/adguardhome/work }
            - { name: conf, mountPath: /opt/adguardhome/conf }
  volumeClaimTemplates:
    - metadata:
        name: work
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 1Gi
    - metadata:
        name: conf
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 100Mi
