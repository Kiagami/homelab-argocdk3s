# adguardhome-sync: repliziert Config/Filter/Rewrites von adguard-0 auf adguard-1 und -2
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adguardhome-sync
spec:
  replicas: 1
  selector:
    matchLabels:
      app: adguardhome-sync
  template:
    metadata:
      labels:
        app: adguardhome-sync
    spec:
      containers:
        - name: sync
          image: ghcr.io/bakito/adguardhome-sync:v0.7.7   # auf aktuelle Version pinnen
          args: ["run"]
          env:
            - { name: CRON, value: "*/10 * * * *" }
            - { name: RUNONSTART, value: "true" }
            - { name: ORIGIN_URL, value: "http://adguard-0.adguard-headless.adguard.svc:80" }
            - { name: REPLICA1_URL, value: "http://adguard-1.adguard-headless.adguard.svc:80" }
            - { name: REPLICA2_URL, value: "http://adguard-2.adguard-headless.adguard.svc:80" }
            - name: ORIGIN_USERNAME
              valueFrom: { secretKeyRef: { name: adguard-sync-credentials, key: username } }
            - name: ORIGIN_PASSWORD
              valueFrom: { secretKeyRef: { name: adguard-sync-credentials, key: password } }
            - name: REPLICA1_USERNAME
              valueFrom: { secretKeyRef: { name: adguard-sync-credentials, key: username } }
            - name: REPLICA1_PASSWORD
              valueFrom: { secretKeyRef: { name: adguard-sync-credentials, key: password } }
            - name: REPLICA2_USERNAME
              valueFrom: { secretKeyRef: { name: adguard-sync-credentials, key: username } }
            - name: REPLICA2_PASSWORD
              valueFrom: { secretKeyRef: { name: adguard-sync-credentials, key: password } }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits:   { memory: 128Mi }
