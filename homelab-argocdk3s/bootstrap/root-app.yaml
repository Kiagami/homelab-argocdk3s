# Einmalig manuell anwenden: kubectl apply -f bootstrap/root-app.yaml
# Danach verwaltet ArgoCD alles unter apps/ selbst (App-of-Apps).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/DEIN-USER/argocd-homelab.git   # <-- anpassen
    targetRevision: main
    path: apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
