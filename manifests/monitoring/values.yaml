# Values fuer kube-prometheus-stack auf k3s (Longhorn, Traefik, smtp-relay)

# --- k3s: Control-Plane-Komponenten werden anders bereitgestellt, sonst Dauer-Alerts ---
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false

# --- Prometheus ---
prometheus:
  prometheusSpec:
    retention: 15d
    retentionSize: 15GB
    # Auch ServiceMonitors/PodMonitors/Rules aus anderen Namespaces/Charts einsammeln
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    resources:
      requests: { cpu: 200m, memory: 768Mi }
      limits:   { memory: 2Gi }
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi

# --- Alertmanager: Mails ueber das interne smtp-relay ---
alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 1Gi
  config:
    global:
      resolve_timeout: 5m
      smtp_smarthost: 'smtp-relay.smtp-relay.svc.cluster.local:25'
      smtp_from: 'kianmiertsch@gmail.com'   # bei Gmail: eigene Adresse oder bestaetigter Alias
      smtp_require_tls: false               # Relay im Cluster, kein TLS noetig
    route:
      receiver: mail
      group_by: ['namespace', 'alertname']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        # Dauer-Testalerts nicht per Mail senden
        - receiver: "null"
          matchers:
            - alertname =~ "Watchdog|InfoInhibitor"
    receivers:
      - name: "null"
      - name: mail
        email_configs:
          - to: 'kianmiertsch@gmail.com'
            send_resolved: true

# --- Grafana ---
grafana:
  # Passwort aus Secret (siehe secret.example.yaml), nicht im Git
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  deploymentStrategy:
    type: Recreate          # RWO-Volume: alter Pod muss weg, bevor der neue startet
  persistence:
    enabled: true
    storageClassName: longhorn
    accessModes: ["ReadWriteOnce"]
    size: 2Gi
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits:   { memory: 512Mi }
  grafana.ini:
    server:
      domain: grafana.kmsystems.ddns.net
      root_url: https://grafana.kmsystems.ddns.net
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
      traefik.ingress.kubernetes.io/router.middlewares: "kube-system-heimnetz-whitelist@kubernetescrd"
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
    hosts:
      - grafana.kmsystems.ddns.net
    path: /
    tls:
      - secretName: grafana-tls-cert
        hosts:
          - grafana.kmsystems.ddns.net

# --- Eigene Alerts (Nodes, CoreDNS) ---
# An das Ende von manifests/monitoring/values.yaml anhaengen (Top-Level-Key, nicht verschachteln).
# Der Chart legt daraus eine PrometheusRule an, Prometheus laedt sie automatisch.
additionalPrometheusRulesMap:
  node-alerts:
    groups:
      - name: node.custom
        rules:
          - alert: NodeNotReady
            expr: kube_node_status_condition{condition="Ready",status="true"} == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Node {{ $labels.node }} ist NotReady"
              description: "Der Node {{ $labels.node }} meldet seit 2 Minuten nicht Ready."

          - alert: NodeExporterDown
            expr: up{job="node-exporter"} == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Node-Exporter auf {{ $labels.instance }} nicht erreichbar"
              description: "Prometheus bekommt seit 2 Minuten keine Metriken von {{ $labels.instance }}."

          - alert: NodeHighCpu
            expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "Hohe CPU-Last auf {{ $labels.instance }}"
              description: "CPU-Auslastung seit 15 Minuten ueber 85 % (aktuell {{ $value | printf \"%.0f\" }} %)."

          - alert: NodeHighMemory
            expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 90
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Wenig freier RAM auf {{ $labels.instance }}"
              description: "RAM-Auslastung seit 10 Minuten ueber 90 % (aktuell {{ $value | printf \"%.0f\" }} %)."

          - alert: NodeDiskAlmostFull
            expr: |
              (node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay|squashfs|ramfs"}
                / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay|squashfs|ramfs"}) * 100 < 15
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Root-Dateisystem auf {{ $labels.instance }} fast voll"
              description: "Weniger als 15 % frei (aktuell {{ $value | printf \"%.0f\" }} % frei)."

# In values.yaml unter den bestehenden Key "additionalPrometheusRulesMap:" einruecken
# (neben "node-alerts:"), nicht als zweiten Top-Level-Key.
  coredns-alerts:
    groups:
      - name: coredns.custom
        rules:
          - alert: CoreDNSLessThanTwoReplicas
            expr: kube_deployment_status_replicas_available{namespace="kube-system",deployment="coredns"} < 2
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "CoreDNS hat weniger als 2 verfuegbare Replicas"
              description: "Nur {{ $value }} CoreDNS-Pod(s) verfuegbar. Bei einem Node-Ausfall faellt der Cluster-DNS aus."

          - alert: CoreDNSReplicasOnSameNode
            expr: count by (node) (kube_pod_info{namespace="kube-system",pod=~"coredns-.*"}) > 1
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Mehrere CoreDNS-Pods laufen auf {{ $labels.node }}"
              description: "Die CoreDNS-Pods sind nicht auf verschiedene Nodes verteilt."