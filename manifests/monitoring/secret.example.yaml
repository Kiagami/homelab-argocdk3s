# NUR Vorlage, nicht committen und nicht in eine kustomization aufnehmen.
# Besser per kubectl anlegen (Namespace muss vor dem ersten Sync existieren):
#   kubectl create namespace monitoring
#   kubectl -n monitoring create secret generic grafana-admin \
#     --from-literal=admin-user='admin' \
#     --from-literal=admin-password='<starkes-passwort>'
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  namespace: monitoring
type: Opaque
stringData:
  admin-user: admin
  admin-password: change-me
