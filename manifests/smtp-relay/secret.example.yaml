# NUR Vorlage, nicht in die kustomization.yaml aufnehmen und nicht mit echten Werten committen.
# Besser per kubectl anlegen:
#   kubectl create namespace smtp-relay
#   kubectl -n smtp-relay create secret generic smtp-relay-credentials \
#     --from-literal=username='dein-smtp-user' \
#     --from-literal=password='dein-smtp-passwort'
apiVersion: v1
kind: Secret
metadata:
  name: smtp-relay-credentials
  namespace: smtp-relay
type: Opaque
stringData:
  username: dein-smtp-user
  password: dein-smtp-passwort
