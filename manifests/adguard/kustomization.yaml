apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: adguard
resources:
  - statefulset.yaml
  - service-dns.yaml
  - service-ui.yaml
  - ingress.yaml
  - pdb.yaml
  # Erst aktivieren, wenn alle 3 Pods per Setup-Wizard eingerichtet sind
  # und das Secret adguard-sync-credentials existiert (siehe README):
  - sync/deployment.yaml
