# DNS ueber MetalLB (nicht ueber Traefik)
apiVersion: v1
kind: Service
metadata:
  name: adguard-dns
  annotations:
    metallb.universe.tf/loadBalancerIPs: 192.168.7.55   # <-- freie IP aus deinem MetalLB-Pool
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local   # behaelt Client-IPs fuer die AdGuard-Statistik
  selector:
    app: adguard
  ports:
    - { name: dns-udp, port: 53, targetPort: 53, protocol: UDP }
    - { name: dns-tcp, port: 53, targetPort: 53, protocol: TCP }
