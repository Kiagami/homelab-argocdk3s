# Headless: stabile Pod-DNS-Namen (adguard-0.adguard-headless ...) fuer den Sync
apiVersion: v1
kind: Service
metadata:
  name: adguard-headless
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: adguard
  ports:
    - { name: http, port: 80, targetPort: 80 }
---
# Web-UI zeigt nur auf Pod 0 (= "Origin"), damit du immer dieselbe Config bearbeitest.
# Die anderen Replicas bekommen sie per adguardhome-sync.
apiVersion: v1
kind: Service
metadata:
  name: adguard-ui
spec:
  selector:
    app: adguard
    statefulset.kubernetes.io/pod-name: adguard-0
  ports:
    - { name: http, port: 80, targetPort: 80 }
