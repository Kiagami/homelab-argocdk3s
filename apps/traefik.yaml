apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    # 1. Offizielles Traefik Helm Chart
    - repoURL: https://traefik.github.io/charts
      chart: traefik
      targetRevision: 42.1.3
      helm:
        releaseName: traefik
        valuesObject:
          service:
            type: LoadBalancer
            externalTrafficPolicy: Local
          ports:
            websecure:
              forwardedHeaders:
                trustedIPs:
                  - 10.0.0.0/8
                  - 192.168.0.0/16

    # 2. Eigene Manifeste (Middleware, Certificates, Issuer)
    - repoURL: https://github.com/Kiagami/homelab-argocdk3s.git
      targetRevision: main
      path: manifests/traefik

  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true