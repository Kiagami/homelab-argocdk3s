apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rancher
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://releases.rancher.com/server-charts/latest
      chart: rancher
      targetRevision: 2.15.3
      helm:
        valueFiles:
          - $values/manifests/rancher/values.yaml
    - repoURL: https://github.com/Kiagami/homelab-argocdk3s.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/Kiagami/homelab-argocdk3s.git
      targetRevision: main
      path: manifests/rancher
      directory:
        include: ingress.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: cattle-system
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true