apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: smtp-relay
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Kiagami/homelab-argocdk3s.git
    targetRevision: main
    path: manifests/smtp-relay
  destination:
    server: https://kubernetes.default.svc
    namespace: smtp-relay
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
